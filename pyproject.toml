[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "heimdall-neo"
version = "0.1.0"
authors = [{ name = "Taylor St Jean" }]
description = "A locally hosted web app designed to provide real time updates to the MPC NEOCP."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1.3",
    "polars>=2.0.0",
    "requests>=2.34.2",
    "waitress>=3.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Framework :: Flask",
    "Environment :: Web Environment",
]

[project.scripts]
heimdall = "heimdall_neo.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/heimdall_neo"]

[project.urls]
Repository = "https://github.com/taylornstjean/heimdall"
